[project]
name = "wenext-fixture-site"
version = "0.1.0"
description = "Fixture site E1.F0 — dwa archetypy kanału, osiem wymiarów 22.7, login wall i MFA"
license = "MIT"
requires-python = ">=3.12,<3.13"

# Piny są dokładne celowo. Fixture ma być odtwarzalny co do bajtu — dryf szablonów
# Jinja albo serializacji JSON w Starlette zmieniłby content_hash bez zmiany seeda.
dependencies = [
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "uvicorn[standard]==0.52.4",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[project.scripts]
wenext-fixture-site = "wenext_fixture_site.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wenext_fixture_site"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
