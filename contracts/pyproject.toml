[project]
name = "community-os-contracts"
version = "0.1.0"
description = "Kontrakty domenowe Community Marketing Autopilot OS — faza E1.F0"
license = "MIT"
# D-021: the SAME upper bound as the root `pyproject.toml`. Until 2026-08-31 this line read
# `>=3.12` with no upper bound, so `contracts/.venv` could sit on Python 3.14 while the other
# six environments ran 3.12 — formally legal for contracts alone, illegal for the workspace it
# is a member of. The repo-consistency suite runs on THIS interpreter, so the environment two
# minor versions ahead of everything else was the one judging everything else.
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/community_os_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
