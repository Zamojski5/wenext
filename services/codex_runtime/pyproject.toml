[project]
name = "wenext-codex-runtime"
version = "0.1.0"
description = "Codex runtime adapter — app-server, hardening, cztery izolowane thread roles (E1.F0)"
license = "MIT"
requires-python = ">=3.12"
# Wersje są przypięte co do patcha, bo protokół app-servera jest wersjonowany razem
# z CLI, a SDK zakłada zgodność 1:1 z dowożoną binarką. Patrz versions.lock.toml [codex].
dependencies = [
    "community-os-contracts",
    "openai-codex==0.147.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codex_runtime"]

[tool.uv.sources]
community-os-contracts = { workspace = true }
