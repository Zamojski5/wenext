[project]
name = "wenext-community-observer"
version = "0.1.0"
description = "Odczyt prawdziwych communities przez publiczne/oficjalne API — Outcome A (docs/OUTCOMES.md §5)"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "community-os-contracts",
    # The same major as the control plane's dev dependency, so one HTTP client in the repo.
    "httpx>=0.28",
    "pydantic>=2.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["community_observer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Declared here as well as in the root pyproject.toml: this file is the inifile whenever pytest
# starts inside the package, so a marker known only to the root would come out as a warning
# exactly where it is used.
markers = [
    "live: dotyka prawdziwego API platformy przez sieć (Hacker News bez konta; Reddit wymaga poświadczeń)",
]

[tool.uv.sources]
community-os-contracts = { workspace = true }
