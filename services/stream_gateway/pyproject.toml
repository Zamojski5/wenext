[project]
name = "wenext-stream-gateway"
version = "0.1.0"
description = "RFB-aware Stream Gateway z egzekwowaniem VIEW_ONLY po stronie serwera — E1.F0"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "community-os-contracts",
    "cryptography>=45",
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stream_gateway"]

[tool.uv.sources]
community-os-contracts = { workspace = true }
