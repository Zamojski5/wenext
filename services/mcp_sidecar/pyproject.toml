[project]
name = "wenext-mcp-sidecar"
version = "0.1.0"
description = "Task-scoped read-only MCP sidecar — sześć narzędzi, fail-closed (E1.F0)"
license = "MIT"
requires-python = ">=3.12"
# Świadomie bez zależności zewnętrznych. Serwer implementuje podzbiór MCP po stdio
# na bibliotece standardowej — powierzchnia sidecara jest granicą bezpieczeństwa,
# więc każda dodatkowa zależność to kod, który tę granicę może przesunąć.
dependencies = ["community-os-contracts"]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_sidecar"]

[tool.uv.sources]
community-os-contracts = { workspace = true }
