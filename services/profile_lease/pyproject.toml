[project]
name = "wenext-profile-lease"
version = "0.1.0"
description = "ProfileLease i fencing token na PostgreSQL — E1.F0"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["community-os-contracts", "asyncpg>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["profile_lease"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
community-os-contracts = { workspace = true }
