[project]
name = "wenext-gonogo"
version = "0.1.0"
description = "Generator raportu Go/No-Go fazy E1.F0"
license = "MIT"
requires-python = ">=3.12"
# Bez zależności celowo: raport ma dać się wygenerować także tam, gdzie nie ma
# pełnego środowiska. criteria.yaml czytamy własnym, minimalnym parserem.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["report.py", "criteria.yaml"]
