      w profilu `manual` i startowany per turn. Katalog `services/mcp_sidecar/` nie istnieje (D11).

  - id: C-05
    granica: GR-1
    opis: >-
      Model nie wykonuje surowych zapisujących `click`/`fill`/`press`. Akcje zapisujące
