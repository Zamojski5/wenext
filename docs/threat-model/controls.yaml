# Kontrole threat modelu E1.F0 w formie maszynowo czytelnej.
#
# Ten plik jest wejściem do `tools/gonogo` i do `docs/threat-model/test_controls.py`.
# Reguła, którą test egzekwuje: KAŻDA ścieżka w `enforced_by` i w `test` musi istnieć
# na dysku. Nieistniejąca ścieżka to kontrola udawana, a udawana kontrola jest gorsza
# niż jawny jej brak.
#
# `status`:
#   EGZEKWOWANE — jest kod albo schemat, który tego pilnuje, ORAZ jest test, który to sprawdza
#   CZESCIOWO   — jest kod, konfiguracja albo zamrożone kryterium bramki, ale nie ma testu
#                 automatycznego; `uwagi` mówią, czego brakuje
#   PLANOWANE   — nic tego jeszcze nie egzekwuje; `enforced_by` jest puste, `faza` mówi kiedy
#
# `zrodlo_w_dokumencie` to numer linii w ROADMAP_CODEX_CDP_COMMUNITY_OS.md.

wersja: 1
zamrozone_dnia: "2026-08-30"
faza: E1.F0
dokument: ROADMAP_CODEX_CDP_COMMUNITY_OS.md

granice:
  GR-1: "strona zewnętrzna → kapsuła (treść jest niezaufanym inputem)"
  GR-2: "kapsuła → proces przeglądarki i profil (build, sandbox, port CDP, cookies)"
  GR-3: "kapsuła ↔ Control Plane (lease, fencing, stan sesji)"
  GR-4: "operator ↔ Control Plane (approval, InteractionLease, stream)"
  GR-5: "granica produktu z sekcji 4 (czego nie robimy w ogóle)"

kontrole:

  # ---------------------------------------------------------------------------
  # GR-1 — treść stron zewnętrznych i runtime modelu
  # ---------------------------------------------------------------------------
  - id: C-01
    granica: GR-1
    opis: >-
      Treść stron zewnętrznych jest niezaufanym inputem. Runtime Codeksa nie widzi bazy,
      sekretów, profili Chromium ani Docker socket i nie ma trasy do sieci kapsuły.
    zrodlo_w_dokumencie: 3950
    status: CZESCIOWO
    enforced_by:
      - docker-compose.yml
    test: []
    uwagi: >-
      Serwis `codex` nie ma wolumenu `profiles`, nie ma DATABASE_URL ani POSTGRES_*, nie ma
      montażu /var/run/docker.sock i jest wyłącznie w `edgenet` (bez `capsulenet`). Testu
      automatycznego nie ma, bo `services/codex_runtime/` jeszcze nie istnieje (D12).

  - id: C-02
    granica: GR-1
    opis: >-
      Runtime modelu nie ma shella ani niekontrolowanego exec; nie może wywołać
      `thread/shellCommand`, `command/exec` ani metod process/config/import/write.
    zrodlo_w_dokumencie: 2222
    status: CZESCIOWO
    enforced_by:
      - tools/gonogo/criteria.yaml
    test: []
    uwagi: >-
      Kontrola `brak_shell_i_exec` jest zamrożona jako wymagana w GATE-3, więc bez dowodu
      bramka nie może dostać GO. Samego egzekwowania w runtimie jeszcze nie ma (D12, D13).

  - id: C-03
    granica: GR-1
    opis: >-
      Model nie zatwierdza własnego proposala. Zgoda jest osobnym obiektem z `approved_by`
      i wskazuje dokładny payload hash; bez niej `authorize_side_effect` rzuca PermissionError.
    zrodlo_w_dokumencie: 3958
    status: EGZEKWOWANE
    enforced_by:
      - contracts/src/community_os_contracts/execution.py
    test:
      - contracts/tests/test_invariants.py
    uwagi: >-
      Testy `test_action_without_approval_cannot_run` i `test_action_without_intent_cannot_run`.

  - id: C-04
    granica: GR-1
    opis: >-
      Model dostaje wyłącznie task-scoped, read-only MCP i nie może rozszerzyć allowlisty.
      Granicy bezpieczeństwa nie opieramy na eksperymentalnym `dynamicTools`.
