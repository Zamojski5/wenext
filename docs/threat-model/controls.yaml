    zrodlo_w_dokumencie: 3956
    status: PLANOWANE
    faza: E1.F5
    enforced_by: []
    test: []
    uwagi: >-
      Action Adapter nie istnieje w F0. W F0 istnieje tylko brama typu (C-03, C-18):
      adapter, gdy powstanie, musi wołać `authorize_side_effect` przed każdym side effectem.

  - id: C-06
    granica: GR-1
    opis: >-
      eTLD+1 służy wyłącznie do klasyfikacji, nigdy do autoryzacji. Granicą uprawnień
